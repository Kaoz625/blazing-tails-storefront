name: Monthly Magazine Release

on:
  schedule:
    # 1st of every month at 9:00 AM UTC
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      brand:
        description: 'Brand to generate (or "all")'
        required: false
        default: 'all'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build storefront
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: blazingtails.nyctailblazers.com

      - name: Post release summary to team chat
        run: |
          MONTH=$(date +"%B %Y")
          ISSUE=$(date +"%m")
          echo "[$(date +%H:%M)] claude-nyc-main: Monthly release deployed → Blazing Tails $MONTH (Issue $ISSUE)" >> ~/.claude-team/chat/magazine.md || true
